<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>Panel — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="xd-pad" style="max-width:360px">
  <form class="xd-panel" onsubmit="return false">
    <fieldset>
      <legend>Lockup</legend>
      <div class="xd-seg">
        <label><input type="radio" name="lk" checked><span>Mark</span></label>
        <label><input type="radio" name="lk"><span>Stacked</span></label>
        <label><input type="radio" name="lk"><span>Wide</span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Geometry</legend>
      <div class="xd-seg">
        <label><input type="radio" name="g" checked><span>As extracted</span></label>
        <label><input type="radio" name="g"><span>Trued</span></label>
      </div>
      <p class="xd-hint">Trued mirrors each column about the center axis and rounds to whole pixels. Row positions are kept exactly.</p>
    </fieldset>
    <div class="xd-stack">
      <button type="button" class="xd-btn xd-btn--primary">Download SVG</button>
      <button type="button" class="xd-btn">Download PNG</button>
    </div>
  </form>
</div>
</body>
</html>
