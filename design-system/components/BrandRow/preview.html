<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>BrandRow — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
.br { display: flex; flex-wrap: wrap; gap: var(--space-24); align-items: center; padding: var(--space-20); }
.on-teal { background: var(--brand-teal); color: var(--brand-white); padding: var(--space-20) var(--space-24); }
</style>
</head>
<body>
<div class="br">
  <div id="a"></div>
  <div id="b" class="on-teal"></div>
</div>
<script>
  var X = window.Xiding;
  document.getElementById('a').innerHTML = X.brandRow(['西顶艺术', '西顶新知', '西顶时光'], { size: '22px' });
  document.getElementById('b').innerHTML = X.brandRow(['西顶艺术', '西顶新知', '西顶时光'], { size: '24px' });
</script>
</body>
</html>
