<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>Mark — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
.mk { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: var(--space-12); padding: var(--space-20); }
.mk svg { display: block; width: 100%; height: auto; border: 1px solid var(--line); }
</style>
</head>
<body>
<div id="root" class="mk"></div>
<script>
  var X = window.Xiding, root = document.getElementById('root');
  root.innerHTML = X.PRESETS.map(function (p) { return X.mark({ colorway: p[0], style: p[1] }); }).join('');
</script>
</body>
</html>
