<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>SceneMenu — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="xd-pad"><div class="xd-menu" id="root"></div></div>
<script>
  var X = window.Xiding, root = document.getElementById('root');
  root.innerHTML = X.SCENES.map(function (s) {
    return '<div class="xd-menu__row"><div class="xd-menu__pillar xd-menu__pillar--' + s.id + '">' + s.brand + '</div>' +
      '<div class="xd-menu__scenes">' + X.brandRow(s.scenes) + '</div><div class="xd-menu__use">' + s.use + '</div></div>';
  }).join('');
</script>
</body>
</html>
