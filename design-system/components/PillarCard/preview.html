<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>PillarCard — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
.pc { display: grid; grid-template-columns: repeat(3, 296px); gap: var(--space-12); }
</style>
</head>
<body>
<div class="xd-pad pc" id="root"></div>
<script>
  var X = window.Xiding, root = document.getElementById('root');
  root.innerHTML = X.BRAND_DETAILS.map(function (b) {
    return '<article class="xd-pcard xd-pcard--' + b.id + '">' +
      '<div class="xd-pcard__field"><p class="xd-pcard__pillar">' + b.zh + '<span>' + b.word + '</span></p><h3 class="xd-pcard__line">' + b.lines.join('<br>') + '</h3></div>' +
      '<footer class="xd-pcard__foot">' + X.mark({ ink: 'currentColor', ground: 'none', title: '西顶' }) + '<b>' + b.zh + '</b></footer>' +
      '</article>';
  }).join('');
</script>
</body>
</html>
