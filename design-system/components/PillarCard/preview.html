<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>PillarCard — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
.pc { display: grid; grid-template-columns: repeat(3, 296px); gap: var(--space-12); }
</style>
</head>
<body>
<div class="xd-pad pc" id="root"></div>
<script>
  var X = window.Xiding, root = document.getElementById('root');
  var lines = {
    mei: '最近一次你否掉<br>AI 给的方案，<br>凭的是什么？',
    zhi: '你怎么把一个团队的活<br>装进一个人的工作流？',
    li: '谁在你最难的时候<br>愿意信你'
  };
  root.innerHTML = X.PILLARS.map(function (p) {
    return '<article class="xd-pcard xd-pcard--' + p.id + '">' +
      '<div class="xd-pcard__field"><p class="xd-pcard__pillar">' + p.zh + '<span>' + p.word + '</span></p><h3 class="xd-pcard__line">' + lines[p.id] + '</h3></div>' +
      '<footer class="xd-pcard__foot">' + X.mark({ ink: 'currentColor', ground: 'none', title: '西顶' }) + '<b>西顶学院</b></footer>' +
      '</article>';
  }).join('');
</script>
</body>
</html>
