<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>Segmented — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="xd-pad" style="display:grid;grid-template-columns:300px 280px;gap:var(--space-24);align-items:start">
  <div class="xd-seg xd-seg--wrap" role="radiogroup" aria-label="Color">
    <label><input type="radio" name="cw" checked><span><i class="xd-swatch" style="background:#628F8A"></i>Temple teal</span></label>
    <label><input type="radio" name="cw"><span><i class="xd-swatch" style="background:#000"></i>Black</span></label>
    <label><input type="radio" name="cw"><span><i class="xd-swatch" style="background:#fff"></i>White</span></label>
    <label><input type="radio" name="cw"><span><i class="xd-swatch" style="background:#fff;box-shadow:inset 0 0 0 4px #628F8A"></i>Teal ink</span></label>
  </div>
  <div class="xd-seg" role="radiogroup" aria-label="Mark style">
    <label><input type="radio" name="st" checked><span>Dot</span></label>
    <label><input type="radio" name="st"><span>Circle</span></label>
    <label><input type="radio" name="st"><span>Point</span></label>
  </div>
</div>
</body>
</html>
