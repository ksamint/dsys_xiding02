<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>ColorwayTile — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
.tiles { display: grid; grid-template-columns: repeat(4, 180px); gap: var(--space-12); padding: var(--space-20); align-items: start; }
</style>
</head>
<body>
<div id="root" class="tiles"></div>
<script>
  var X = window.Xiding, root = document.getElementById('root');
  root.innerHTML = X.PRESETS.slice(0, 4).map(function (p, i) {
    var cw = X.COLORWAYS[p[0]];
    return '<button type="button" class="xd-tile" aria-pressed="' + (i === 0) + '">' + X.mark({ colorway: p[0], style: p[1] }) +
      '<span>' + cw.name + ', ' + X.STYLE_NAMES[p[1]].toLowerCase() + '</span></button>';
  }).join('');
  root.addEventListener('click', function (e) {
    var t = e.target.closest('.xd-tile'); if (!t) return;
    root.querySelectorAll('.xd-tile').forEach(function (b) { b.setAttribute('aria-pressed', String(b === t)); });
  });
</script>
</body>
</html>
