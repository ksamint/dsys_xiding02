<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>DoorPlate — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="xd-pad xd-row" id="root" style="align-items:flex-start"></div>
<script>
  var X = window.Xiding, root = document.getElementById('root');
  var plates = [['mei', '古琴'], ['zhi', '咨询'], ['li', '下午茶']];
  root.innerHTML = plates.map(function (pl) {
    var p = X.PILLARS.filter(function (q) { return q.id === pl[0]; })[0];
    return '<div class="xd-plate xd-plate--' + p.id + '"><div class="xd-plate__field">' + pl[1] + '</div><div class="xd-plate__foot">' + X.brandRow([p.zh, p.word]) + '</div></div>';
  }).join('');
</script>
</body>
</html>
