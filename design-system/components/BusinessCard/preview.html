<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>BusinessCard — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
.cards { display: grid; grid-template-columns: repeat(2, 400px); gap: var(--space-24) var(--space-40); padding: var(--space-24); justify-content: center; }
.cards figure { margin: 0; }
</style>
</head>
<body>
<div id="root" class="cards"></div>
<script>
  var X = window.Xiding, root = document.getElementById('root');
  function fig(svg, cap) { return '<figure class="xd-card">' + svg + '<figcaption class="xd-figcaption">' + cap + '</figcaption></figure>'; }
  function render() {
    root.innerHTML =
      fig(X.card({ side: 'front', front: 'teal' }), 'Front, shared by all three cards') +
      fig(X.card({ side: 'back', back: 'paper', person: X.PEOPLE[0] }), 'Back. ' + X.PEOPLE[0].nameZh) +
      fig(X.card({ side: 'back', back: 'paper', person: X.PEOPLE[1] }), 'Back. ' + X.PEOPLE[1].nameZh) +
      fig(X.card({ side: 'back', back: 'paper', person: X.PEOPLE[2] }), 'Back. ' + X.PEOPLE[2].nameZh);
  }
  render();
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(render); }
</script>
</body>
</html>
