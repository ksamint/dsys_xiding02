<!-- @dsCard group="Assets" height=3440 width=960 -->
<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>AssetKit — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="xd-pad">
  <p class="xd-kit__note" id="note">Every tile is drawn now, from the bundle. Change the bundle and the kit changes with it.</p>
  <div class="xd-kit" id="root" style="margin-top:var(--space-16)"></div>
</div>
<script>
  var X = window.Xiding, root = document.getElementById('root'), note = document.getElementById('note');
  var kit = [], downloads = null;
  function render() {
    kit = X.kit();
    var groups = [];
    kit.forEach(function (a, i) {
      var g = groups.filter(function (x) { return x.name === a.group; })[0];
      if (!g) { g = { name: a.group, items: [] }; groups.push(g); }
      g.items.push(i);
    });
    root.innerHTML = groups.map(function (g) {
      return '<section class="xd-kit__group"><h3 class="xd-kit__head">' + g.name + '</h3>' + g.items.map(function (i) {
        var a = kit[i], dark = /-dark$|-white$/.test(a.name) && a.group === 'Pillars';
        return '<figure class="xd-kit__tile"><div class="xd-kit__art' + (dark ? ' is-dark' : '') + '">' + X.toSVG(a) + '</div>' +
          '<figcaption class="xd-kit__cap"><span>' + a.label + '</span><span class="xd-kit__btns"' + (downloads ? '' : ' hidden') + '>' +
          '<button type="button" data-i="' + i + '" data-f="png">PNG</button><button type="button" data-i="' + i + '" data-f="svg">SVG</button></span></figcaption></figure>';
      }).join('') + '</section>';
    }).join('');
  }
  render();
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(render); }
  root.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-i]'); if (!b || !downloads) return;
    var a = kit[Number(b.dataset.i)];
    var job = b.dataset.f === 'png'
      ? X.toPNG(a).then(function (blob) { return downloads.save({ filename: a.name + '.png', data: blob }); })
      : downloads.save({ filename: a.name + '.svg', data: X.toSVG(a) });
    job.then(function () { note.textContent = a.label + ' saved.'; })
       .catch(function (err) { note.textContent = err && err.code === 'declined' ? 'Save cancelled.' : 'This view cannot save files. Ask Claude for ' + a.name + ' instead.'; });
  });
  var claude = window.claude;
  try { if (!claude && window.parent && window.parent !== window) { claude = window.parent.claude; } } catch (e) { claude = null; }
  if (claude && typeof claude.use === 'function') {
    claude.use('downloads').then(function (d) {
      if (!d) return;
      downloads = d;
      root.querySelectorAll('.xd-kit__btns').forEach(function (el) { el.hidden = false; });
      note.textContent = 'Every tile is drawn now, from the bundle. PNG is drawn with the web fonts; SVG keeps live text.';
    }).catch(function () {});
  }
</script>
</body>
</html>
