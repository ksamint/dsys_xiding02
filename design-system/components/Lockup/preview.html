<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>Lockup — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
.lk { display: flex; gap: var(--space-12); align-items: stretch; padding: var(--space-20); height: 260px; box-sizing: content-box; }
.lk svg { display: block; flex: none; height: 100%; width: auto; border: 1px solid var(--line); }
</style>
</head>
<body>
<div id="root" class="lk"></div>
<script>
  var X = window.Xiding, root = document.getElementById('root');
  root.innerHTML =
    X.mark({ lockup: 'stacked', colorway: 'teal', title: '西顶 XIDING, stacked' }) +
    X.mark({ lockup: 'horizontal', colorway: 'ink', title: '西顶 XIDING, wide' }) +
    X.mark({ lockup: 'horizontal', colorway: 'night', style: 'ring', title: '西顶 XIDING, wide, circle style' });
</script>
</body>
</html>
